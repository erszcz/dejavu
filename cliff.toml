# git-cliff writes the section of a new release in CHANGELOG.md from the git log.
#
# A commit is in the change log only when its message has a trailer `Changelog: <group>`, where
# the group is added, changed, deprecated, removed or fixed. The entry is the subject of the
# commit. A commit with no trailer is not in the change log.
#
# README.md, "Releases", has the commands.

[changelog]
# This must be the same text as the start of CHANGELOG.md: `--prepend` puts the new section after it.
header = """
# Changelog

All notable changes to dejavu are in this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/). The versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html). Before 1.0.0, a minor version can
change a default or the format of the report.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}

{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}\
{% endfor %}\
"""
trim = false

[git]
conventional_commits = false
filter_unconventional = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# The HTML comment sets the order of the groups. The template removes it.
commit_parsers = [
  { message = "(?mi)^Changelog: added\\s*$", group = "<!-- 0 -->Added" },
  { message = "(?mi)^Changelog: changed\\s*$", group = "<!-- 1 -->Changed" },
  { message = "(?mi)^Changelog: deprecated\\s*$", group = "<!-- 2 -->Deprecated" },
  { message = "(?mi)^Changelog: removed\\s*$", group = "<!-- 3 -->Removed" },
  { message = "(?mi)^Changelog: fixed\\s*$", group = "<!-- 4 -->Fixed" },
  { message = ".*", skip = true },
]
