[package]
name = "dejavu"
version = "0.4.0"
edition = "2021"
description = "Finds existing code that does the same job as other code, by structural similarity"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-elixir = "0.3"
tree-sitter-erlang = "0.22"

[profile.release]
debug = false
